include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - go/**
    - build/**
    - android/**
    - macos/**
    - windows/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
