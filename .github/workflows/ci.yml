name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  # Must satisfy pubspec.lock (dart >=3.12, flutter >=3.44) and go.mod (go 1.26).
  FLUTTER_VERSION: "3.47.6"
  GO_VERSION: "1.26.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: go/go.sum }
      - run: flutter create --org dev.kuputun --project-name kuputun --platforms android,linux,windows,macos .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: cd go && go mod tidy && go vet -tags "with_quic,with_utls,with_wireguard,with_gvisor" ./...

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: go/go.sum }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter create --org dev.kuputun --project-name kuputun --platforms android .
      - run: ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973 scripts/build_go.sh android
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_B64 != ''
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks && echo "KUPUTUN_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - run: flutter build apk --release --split-per-abi
        env:
          KUPUTUN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KUPUTUN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUPUTUN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: android, path: build/app/outputs/flutter-apk/*.apk }

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev libnotify-dev
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: go/go.sum }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter create --org dev.kuputun --project-name kuputun --platforms linux .
      - run: scripts/build_go.sh linux
      - run: flutter build linux --release
      - run: scripts/bundle_native.sh linux
      - run: tar -C build/linux/x64/release -czf kuputun-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: kuputun-linux-x64.tar.gz }

  windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: go/go.sum }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter create --org dev.kuputun --project-name kuputun --platforms windows .
      - run: scripts/build_go.sh windows
      - run: flutter build windows --release
      - run: scripts/bundle_native.sh windows
      - run: 7z a kuputun-windows-x64.zip ./build/windows/x64/runner/Release/*
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: kuputun-windows-x64.zip }

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: go/go.sum }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter create --org dev.kuputun --project-name kuputun --platforms macos .
      - run: scripts/build_go.sh macos
      - run: flutter build macos --release
      - run: scripts/bundle_native.sh macos
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/kuputun.app kuputun-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: kuputun-macos-universal.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
